name: Build calendar feed

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (5:17 or 6:17 AM Pacific)
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python build_feed.py -o calendar.ics
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.ics enrich_cache.json
          git diff --cached --quiet || git commit -m "Update calendar feed"
          git push
